# Sirve la SPA de Angular. La API no pasa por aquí: el proxy del servidor (Caddy) envía /api al backend.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Los archivos con hash en el nombre (main-AB12CD34.js) no cambian nunca: caché de un año.
  location ~* -[A-Z0-9]{8}\.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html es el que apunta a los archivos nuevos: siempre se revalida.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Rutas de Angular (/algo): vuelven a index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
