name: CI

# El despliegue lo hace Vercel con su integración de GitHub (cada push a main; previews en PR).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# En PR se cancela la ejecución anterior del mismo ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # En main el rewrite de /api debe apuntar al backend real: con el marcador de la plantilla,
      # el despliegue compilaría bien pero la app no podría hablar con la API.
      - name: Comprobar el destino de /api en vercel.json
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: |
          if grep -q 'example\.com' vercel.json; then
            echo "::error file=vercel.json::El rewrite de /api sigue apuntando a un marcador (backend.example.com). Pon el dominio de producción del backend."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test -- --no-watch
      - run: npm run build
